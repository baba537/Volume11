[package]
name = "volume11"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36.2"
egui-wgpu = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Security", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
windows-core = "0.62.2"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
